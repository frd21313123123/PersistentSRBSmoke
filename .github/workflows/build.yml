name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Tag / Release version (e.g. v0.4.0; if blank, uses .version file)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build KSP plugin
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Validate Settings.cfg
        shell: pwsh
        run: ./scripts/validate-config.ps1

      - name: Restore NuGet packages
        run: msbuild PersistentSRBSmoke.sln /t:Restore /p:Configuration=Release /p:UseKspSkeletons=true

      - name: Compile Debug
        run: msbuild PersistentSRBSmoke.sln /t:Build /p:Configuration=Debug /p:UseKspSkeletons=true /p:RestorePackages=false /p:TreatWarningsAsErrors=true

      - name: Compile Release
        run: msbuild PersistentSRBSmoke.sln /t:Build /p:Configuration=Release /p:UseKspSkeletons=true /p:RestorePackages=false /p:TreatWarningsAsErrors=true

      - name: Package mod
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersistentSRBSmoke-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Validate Settings.cfg
        shell: pwsh
        run: ./scripts/validate-config.ps1

      - name: Restore and compile Release
        run: msbuild PersistentSRBSmoke.sln /restore /t:Build /p:Configuration=Release /p:UseKspSkeletons=true /p:TreatWarningsAsErrors=true

      - name: Package and Publish Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ""
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "") {
              $version = "${{ github.ref_name }}"
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.tag_name }}" -ne "") {
              $version = "${{ inputs.tag_name }}"
          } else {
              $versionData = Get-Content "GameData/PersistentSRBSmoke/PersistentSRBSmoke.version" -Raw | ConvertFrom-Json
              $version = "v$($versionData.VERSION.MAJOR).$($versionData.VERSION.MINOR).$($versionData.VERSION.PATCH)"
          }

          Write-Host "Publishing release version: $version"
          ./scripts/package.ps1 -Version $version

          $existing = gh release view $version 2>$null
          if ($LASTEXITCODE -eq 0) {
              Write-Host "Updating existing release $version..."
              gh release upload $version dist/*.zip --clobber
              gh release edit $version --latest
          } else {
              Write-Host "Creating new release $version..."
              gh release create $version dist/*.zip --target ${{ github.sha }} --generate-notes --title "Persistent SRB Smoke $version" --latest
          }
