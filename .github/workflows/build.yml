name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Tag / Release version (e.g. v0.1.0; if blank, uses .version file)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build KSP plugin
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET for algorithm tests
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run segment algorithm unit tests
        run: dotnet run --project tests/VolumetricSmoke.AlgorithmTests.csproj --configuration Release

      - name: Build Windows/D3D11 volumetric AssetBundle
        uses: KSPModdingLibs/KSPBuildTools/.github/actions/build-assetbundles@main
        with:
          unity-version: 2019.4.18f1
          project-dir: unity/VolumetricSmokeAssets
          output-dir: GameData/PersistentSRBSmoke/PluginData
          build-method: PersistentSRBSmoke.Assets.Editor.BuildVolumetricSmokeBundle.BuildWindowsD3D11
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          PERSISTENT_SRB_SMOKE_BUNDLE_OUTPUT: ${{ github.workspace }}/GameData/PersistentSRBSmoke/PluginData

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: msbuild PersistentSRBSmoke.sln /t:Restore /p:Configuration=Release /p:UseKspSkeletons=true

      - name: Compile
        run: msbuild PersistentSRBSmoke.sln /t:Build /p:Configuration=Release /p:UseKspSkeletons=true /p:RestorePackages=false

      - name: Validate volumetric contract
        shell: pwsh
        run: ./tests/volumetric-smoke-contract.ps1 -RequireBundle

      - name: Package mod
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersistentSRBSmoke-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: >-
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.create_release))
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Windows/D3D11 volumetric AssetBundle
        uses: KSPModdingLibs/KSPBuildTools/.github/actions/build-assetbundles@main
        with:
          unity-version: 2019.4.18f1
          project-dir: unity/VolumetricSmokeAssets
          output-dir: GameData/PersistentSRBSmoke/PluginData
          build-method: PersistentSRBSmoke.Assets.Editor.BuildVolumetricSmokeBundle.BuildWindowsD3D11
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          PERSISTENT_SRB_SMOKE_BUNDLE_OUTPUT: ${{ github.workspace }}/GameData/PersistentSRBSmoke/PluginData

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and compile
        run: msbuild PersistentSRBSmoke.sln /restore /t:Build /p:Configuration=Release /p:UseKspSkeletons=true

      - name: Validate volumetric contract
        shell: pwsh
        run: ./tests/volumetric-smoke-contract.ps1 -RequireBundle

      - name: Package and Publish Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ""
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "") {
              $version = "${{ github.ref_name }}"
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.tag_name }}" -ne "") {
              $version = "${{ inputs.tag_name }}"
          } else {
              $versionData = Get-Content "GameData/PersistentSRBSmoke/PersistentSRBSmoke.version" -Raw | ConvertFrom-Json
              $version = "v$($versionData.VERSION.MAJOR).$($versionData.VERSION.MINOR).$($versionData.VERSION.PATCH)"
          }

          Write-Host "Publishing release version: $version"
          ./scripts/package.ps1 -Version $version

          $existing = gh release view $version 2>$null
          if ($LASTEXITCODE -eq 0) {
              Write-Host "Updating existing release $version..."
              gh release upload $version dist/*.zip --clobber
              gh release edit $version --latest
          } else {
              Write-Host "Creating new release $version..."
              gh release create $version dist/*.zip --target ${{ github.sha }} --generate-notes --title "Persistent SRB Smoke $version" --latest
          }
