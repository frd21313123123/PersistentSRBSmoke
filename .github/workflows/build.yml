name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build KSP plugin
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: msbuild PersistentSRBSmoke.sln /t:Restore /p:Configuration=Release /p:UseKspSkeletons=true

      - name: Compile
        run: msbuild PersistentSRBSmoke.sln /t:Build /p:Configuration=Release /p:UseKspSkeletons=true /p:RestorePackages=false

      - name: Package mod
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersistentSRBSmoke-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and compile
        run: msbuild PersistentSRBSmoke.sln /restore /t:Build /p:Configuration=Release /p:UseKspSkeletons=true

      - name: Package mod
        shell: pwsh
        run: ./scripts/package.ps1 -Version "${{ github.ref_name }}"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip --generate-notes --title "Persistent SRB Smoke ${{ github.ref_name }}"
