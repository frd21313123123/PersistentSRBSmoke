PERSISTENT_SRB_SMOKE
{
    enabled = true

    // Performance / persistence
    maxParticles = 36000
    maxEmitPerFrame = 160
    lifetime = 210

    // Existing smoke is re-evaluated this many times per second. Old/far smoke is additionally
    // throttled by the per-particle LOD settings below while Unity keeps integrating its velocity.
    dynamicMotionHz = 6

    // Each cloudlet is a set of crossed transparent quads. Three planes are the new balanced
    // default; the previous six-plane mesh roughly doubled transparent overdraw.
    cloudletPlanes = 3

    // Distance sorting is expensive with tens of thousands of transparent cloudlets. Enable this
    // only if visual ordering artifacts are more important than the extra CPU cost.
    sortParticles = false

    // Dynamic-motion LOD. Age values are normalized over each particle's lifetime.
    dynamicMidAge = 0.20
    dynamicOldAge = 0.55
    dynamicMidStride = 2
    dynamicOldStride = 4
    dynamicFarDistance = 5000
    dynamicFarStrideMultiplier = 2

    // Altitude samples for the cached wind field. Perlin noise is evaluated per layer instead of
    // several times for every particle.
    windCacheLayers = 96

    // Keep smoke aging/motion synchronized with KSP Universal Time. This makes time warp speed up
    // expansion, drift and fading instead of leaving the plume evolving in real time.
    followUniversalTime = true
    maxWarpSimulationStep = 5

    // Disable stock/legacy smoke particle emitters on SolidFuel engine parts. Flame and Waterfall
    // effects are intentionally left alone; only objects identified as smoke are suppressed.
    suppressStockSmoke = true
    stockSmokeRefreshInterval = 0.75

    // Trail continuity
    baseEmissionRate = 32
    particlesPerMeter = 0.30
    maxParticleSpacing = 1.75
    highAltitudeSpacingMultiplier = 1.25

    // SRB exhaust carries its own particulate mass, so the plume should remain visible in thin air.
    thinAtmosphereDensityFloor = 0.42
    teleportDistance = 750

    // Visual appearance / expansion
    startSize = 8.0
    sizeGrowth = 18.0
    highAltitudeSizeMultiplier = 1.85
    opacity = 0.80

    // Neutral bright smoke base. Lighting is still approximated by particle colour in this renderer;
    // the planned volumetric renderer will move this to density/scattering based lighting.
    smokeBrightness = 0.96
    engineColorVariation = 0.05

    // Engine-dependent smoke scaling. maxThrust is interpreted in kN and mapped logarithmically
    // between engineMinThrust and engineMaxThrust.
    engineScalingEnabled = true
    engineMinThrust = 8
    engineMaxThrust = 800

    // Tiny separation motors use values near the "small" side. Large SRBs use the "large" side.
    smallEngineEmissionMultiplier = 0.18
    largeEngineEmissionMultiplier = 1.10

    smallEngineSizeMultiplier = 0.38
    largeEngineSizeMultiplier = 1.10

    smallEngineLifetimeMultiplier = 0.45
    largeEngineLifetimeMultiplier = 1.00

    smallEngineOpacityMultiplier = 0.72
    largeEngineOpacityMultiplier = 1.00

    // Larger spacing means fewer persistent cloudlets from small motors.
    smallEngineSpacingMultiplier = 2.40
    largeEngineSpacingMultiplier = 0.95

    // Local particle motion and cloud spreading
    driftSpeed = 1.8
    diffusionSpeed = 3.2
    diffusionGrowth = 1.55
    buoyancy = 0.24
    dynamicWindResponse = 2.4
    turbulenceStrength = 1.1
    turbulenceFrequency = 0.055

    // Near the pad, ordinary wind should be weak so the entire cloud does not immediately leave
    // the launch site. The density-driven padCloud model below provides the strong sideways motion.
    nearGroundHoldHeight = 60
    nearGroundWindMultiplier = 0.12
    nearGroundDiffusionMultiplier = 0.25
    nearGroundBuoyancyMultiplier = 0.40

    // Shuttle-style launch-pad cloud. Cloudlets are grouped into coarse 3D cells. Dense cells create
    // horizontal pressure away from the overall cloud centre; thinning outer lobes receive updraft.
    padCloudEnabled = true
    padCloudHeight = 120
    padCloudCellSize = 18
    padCloudDensityThreshold = 5
    padCloudDensitySaturation = 24
    padCloudOutflowSpeed = 18
    padCloudUpdraftSpeed = 5.5
    padCloudGlobalBias = 0.72

    // Altitude-dependent wind shear
    windEnabled = true
    windSpeed = 7.0
    windLayerHeight = 1800
    windTopAltitude = 32000
    windDirectionChangeRadians = 1.15
    windTimeScale = 0.0006

    debugLogging = false
}
