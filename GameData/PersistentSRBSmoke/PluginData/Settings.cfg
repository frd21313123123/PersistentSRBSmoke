PERSISTENT_SRB_SMOKE
{
    enabled = true

    // Performance / persistence
    maxParticles = 56000
    maxEmitPerFrame = 256
    lifetime = 210
    dynamicMotionHz = 10

    // Time-warp synchronization
    followUniversalTime = true
    maxWarpSimulationStep = 5

    // Remove vanilla/legacy SRB smoke while retaining flame/Waterfall visuals.
    suppressStockSmoke = true
    stockSmokeRefreshInterval = 0.75

    // Trail continuity. v0.4.2 intentionally uses more overlap so the trail remains a continuous
    // mass at high vehicle speed and at long camera distance instead of turning into beads.
    baseEmissionRate = 46
    particlesPerMeter = 0.48
    maxParticleSpacing = 1.10
    highAltitudeSpacingMultiplier = 1.12
    thinAtmosphereDensityFloor = 0.52
    teleportDistance = 750

    // Base appearance / expansion. The initial core is wider and old smoke grows to large billows.
    startSize = 12.5
    sizeGrowth = 21.0
    highAltitudeSizeMultiplier = 2.05
    opacity = 0.94
    smokeBrightness = 0.84
    engineColorVariation = 0.08

    // Shared volumetric optics ------------------------------------------------------------------
    volumetricLightingEnabled = true
    volumetricScatteringForward = 0.85
    volumetricScatteringBackward = -0.35
    volumetricMultipleScattering = 0.62
    volumetricSoftDepthFactor = 1.65
    volumetricSunIntensity = 1.06
    volumetricAmbientIntensity = 0.58
    volumetricBeerPowderFactor = 0.68

    // TRUE RAYMARCHED VOLUME --------------------------------------------------------------------
    raymarchedVolumetricEnabled = true
    raymarchMaxCloudlets = 8000
    raymarchSteps = 24
    raymarchShadowSteps = 4
    raymarchDensityMultiplier = 1.48
    raymarchExtinction = 2.35

    // NATIVE 3D FALLBACK ------------------------------------------------------------------------
    // Seven slices on each axis plus the new multi-lobe cloudlet geometry create a thick,
    // cauliflower-like volume instead of a chain of tiny translucent spheres.
    nativeVolumeSlicesPerAxis = 7
    nativeVolumeSliceOpacity = 0.42
    fallbackMinimumLight = 0.78
    fallbackCoreShadow = 0.18

    // Engine-dependent smoke scaling -------------------------------------------------------------
    engineScalingEnabled = true
    engineMinThrust = 8
    engineMaxThrust = 800
    smallEngineEmissionMultiplier = 0.16
    largeEngineEmissionMultiplier = 1.30
    smallEngineSizeMultiplier = 0.34
    largeEngineSizeMultiplier = 1.38
    smallEngineLifetimeMultiplier = 0.45
    largeEngineLifetimeMultiplier = 1.00
    smallEngineOpacityMultiplier = 0.68
    largeEngineOpacityMultiplier = 1.08
    smallEngineSpacingMultiplier = 2.50
    largeEngineSpacingMultiplier = 0.82

    // Local particle motion and cloud spreading
    driftSpeed = 1.65
    diffusionSpeed = 3.8
    diffusionGrowth = 1.75
    buoyancy = 0.26
    dynamicWindResponse = 2.4
    turbulenceStrength = 1.45
    turbulenceFrequency = 0.050

    // Near-pad wind hold
    nearGroundHoldHeight = 60
    nearGroundWindMultiplier = 0.12
    nearGroundDiffusionMultiplier = 0.25
    nearGroundBuoyancyMultiplier = 0.40

    // Shuttle-style density-driven launch-pad cloud
    padCloudEnabled = true
    padCloudHeight = 120
    padCloudCellSize = 18
    padCloudDensityThreshold = 5
    padCloudDensitySaturation = 24
    padCloudOutflowSpeed = 18
    padCloudUpdraftSpeed = 5.5
    padCloudGlobalBias = 0.72

    // Altitude-dependent wind shear
    windEnabled = true
    windSpeed = 7.0
    windLayerHeight = 1800
    windTopAltitude = 32000
    windDirectionChangeRadians = 1.15
    windTimeScale = 0.0006

    debugLogging = false
}
