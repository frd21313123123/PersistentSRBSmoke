PERSISTENT_SRB_SMOKE
{
    enabled = true

    // Performance / persistence
    maxParticles = 48000
    maxEmitPerFrame = 192
    lifetime = 210
    dynamicMotionHz = 10

    // Time-warp synchronization
    followUniversalTime = true
    maxWarpSimulationStep = 5

    // Remove vanilla/legacy SRB smoke while retaining flame/Waterfall visuals.
    suppressStockSmoke = true
    stockSmokeRefreshInterval = 0.75

    // Trail continuity
    baseEmissionRate = 32
    particlesPerMeter = 0.30
    maxParticleSpacing = 1.75
    highAltitudeSpacingMultiplier = 1.25
    thinAtmosphereDensityFloor = 0.42
    teleportDistance = 750

    // Base appearance / expansion. Engine-specific colour remains the primary smoke albedo.
    startSize = 8.0
    sizeGrowth = 18.0
    highAltitudeSizeMultiplier = 1.85
    opacity = 0.80
    smokeBrightness = 0.78
    engineColorVariation = 0.08

    // Shared volumetric optics ------------------------------------------------------------------
    volumetricLightingEnabled = true
    volumetricScatteringForward = 0.85
    volumetricScatteringBackward = -0.35
    volumetricMultipleScattering = 0.55
    volumetricSoftDepthFactor = 1.65
    volumetricSunIntensity = 1.10
    volumetricAmbientIntensity = 0.46
    volumetricBeerPowderFactor = 0.72

    // TRUE RAYMARCHED VOLUME --------------------------------------------------------------------
    // Activates automatically when PersistentSRBSmoke/VolumetricSmoke is available from the
    // optional .shab shader bundle. Shuriken still simulates motion/lifetime; rendering switches
    // to instanced proxy cubes with a procedural 3D density raymarch.
    raymarchedVolumetricEnabled = true

    // Maximum number of raymarched cloudlets visible in one frame. Higher values cost GPU time.
    raymarchMaxCloudlets = 7000

    // 24 primary samples + 4 light-shadow samples is the default quality/performance balance.
    raymarchSteps = 24
    raymarchShadowSteps = 4
    raymarchDensityMultiplier = 1.15
    raymarchExtinction = 2.10

    // NATIVE 3D FALLBACK ------------------------------------------------------------------------
    // Used when the .shab shader is not installed. Unlike the old six cards at the same centre,
    // these density slices are distributed through X/Y/Z so every cloudlet occupies real volume.
    nativeVolumeSlicesPerAxis = 5
    nativeVolumeSliceOpacity = 0.20

    // v0.4.0 could turn the whole smoke trail black by applying lighting attenuation twice.
    // These limits keep the fallback high-albedo like real SRB exhaust while still allowing a
    // darker core and brighter sun-facing edges.
    fallbackMinimumLight = 0.72
    fallbackCoreShadow = 0.16

    // Engine-dependent smoke scaling -------------------------------------------------------------
    engineScalingEnabled = true
    engineMinThrust = 8
    engineMaxThrust = 800
    smallEngineEmissionMultiplier = 0.18
    largeEngineEmissionMultiplier = 1.10
    smallEngineSizeMultiplier = 0.38
    largeEngineSizeMultiplier = 1.10
    smallEngineLifetimeMultiplier = 0.45
    largeEngineLifetimeMultiplier = 1.00
    smallEngineOpacityMultiplier = 0.72
    largeEngineOpacityMultiplier = 1.00
    smallEngineSpacingMultiplier = 2.40
    largeEngineSpacingMultiplier = 0.95

    // Local particle motion and cloud spreading
    driftSpeed = 1.8
    diffusionSpeed = 3.2
    diffusionGrowth = 1.55
    buoyancy = 0.24
    dynamicWindResponse = 2.4
    turbulenceStrength = 1.1
    turbulenceFrequency = 0.055

    // Near-pad wind hold
    nearGroundHoldHeight = 60
    nearGroundWindMultiplier = 0.12
    nearGroundDiffusionMultiplier = 0.25
    nearGroundBuoyancyMultiplier = 0.40

    // Shuttle-style density-driven launch-pad cloud
    padCloudEnabled = true
    padCloudHeight = 120
    padCloudCellSize = 18
    padCloudDensityThreshold = 5
    padCloudDensitySaturation = 24
    padCloudOutflowSpeed = 18
    padCloudUpdraftSpeed = 5.5
    padCloudGlobalBias = 0.72

    // Altitude-dependent wind shear
    windEnabled = true
    windSpeed = 7.0
    windLayerHeight = 1800
    windTopAltitude = 32000
    windDirectionChangeRadians = 1.15
    windTimeScale = 0.0006

    debugLogging = false
}
