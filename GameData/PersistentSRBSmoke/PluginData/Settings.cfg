PERSISTENT_SRB_SMOKE
{
    enabled = true

    // Performance / persistence
    maxParticles = 48000
    maxEmitPerFrame = 120
    lifetime = 210

    // Existing smoke is re-evaluated this many times per second. Old/far smoke is additionally
    // throttled by the per-particle LOD settings below while Unity keeps integrating its velocity.
    dynamicMotionHz = 4

    // Expensive wind/flow reevaluation is time-sliced while the entire trail is off screen.
    // Unity continues integrating the existing particle velocities between those updates.
    offscreenDynamicMotionHz = 0.5

    // Full loaded-vessel engine discovery is a fallback safety scan, so it does not need to run
    // every frame or every second.
    engineScanInterval = 2

    // Three crossed planes restore the full volumetric silhouette from v0.6.1.
    cloudletPlanes = 3

    // Distance sorting is expensive with tens of thousands of transparent cloudlets.
    sortParticles = false

    // If EVE Volumetric Clouds is installed, use its already-loaded cloud-volume particle shader.
    // No EVE files are bundled with this mod; without EVE the procedural cloudlet renderer is used.
    preferEveVolumetricShader = true
    volumetricDensity = 1.05
    volumetricMinScatter = 0.82
    volumetricSoftDepth = 0.008

    // Dynamic-motion LOD. Age values are normalized over each particle's lifetime.
    dynamicMidAge = 0.20
    dynamicOldAge = 0.55
    dynamicMidStride = 3
    dynamicOldStride = 8
    dynamicFarDistance = 3500
    dynamicFarStrideMultiplier = 3

    // Legacy destructive culling is disabled: it removed optical depth and erased about 90% of the
    // long trail. These values are retained only so older user configs remain readable.
    adaptiveParticleCulling = false
    particleCullingStartAge = 0.35
    particleCullingPower = 0.65
    particleCullingMinimumKeep = 0.50

    // Normal craft keep full density. Larger booster clusters share samples, while Beer-Lambert
    // compensation transfers the omitted samples' optical depth to those that remain.
    fullDensityEmitterBudget = 8
    minimumEmitterDensityScale = 0.35

    // Samples for the smooth large-scale altitude profile. Catmull-Rom interpolation removes
    // visible boundaries between cached samples.
    windCacheLayers = 64

    // Keep smoke aging/motion synchronized with KSP Universal Time.
    followUniversalTime = true
    maxWarpSimulationStep = 5

    // Disable stock/legacy smoke particle emitters on SolidFuel engine parts.
    suppressStockSmoke = true
    stockSmokeRefreshInterval = 0.75

    // Trail continuity
    // Dense stratified deposition: many low-density samples merge into one continuous cloud field
    // instead of appearing as a chain of individually opaque puffs.
    baseEmissionRate = 52
    particlesPerMeter = 1.10
    maxParticleSpacing = 0.55
    highAltitudeSpacingMultiplier = 1.25

    // Time-based pad emission fades smoothly by this speed. Above it, smoke density is determined
    // only by distance travelled, so acceleration cannot switch the trail to another pattern.
    timeEmissionFadeSpeed = 20

    // Persistent cloud centre is moved down the exhaust direction by birth diameter * multiplier
    // plus the absolute clearance, keeping even the largest fresh cloudlets below the nozzle.
    nozzleOffsetDiameters = 0.55
    nozzleClearance = 5.0

    thinAtmosphereDensityFloor = 0.42
    teleportDistance = 750

    // Visual appearance / expansion of the long-lived persistent trail.
    startSize = 24.0
    sizeGrowth = 14.0
    highAltitudeSizeMultiplier = 1.85
    opacity = 0.88

    // Bright cloud-white smoke; density still comes from many translucent overlapping samples.
    smokeBrightness = 1.16
    engineColorVariation = 0.05

    // Separate short-lived near-nozzle layer. It inherits most of the moving nozzle velocity, so
    // a fast rocket does not outrun its own close-range smoke and leave a row of detached puffs.
    nearNozzleEnabled = true
    nearNozzleMaxParticles = 6500
    nearNozzleEmissionRate = 110
    nearNozzleParticlesPerMeter = 0.70
    nearNozzleMaxEmitPerFrame = 96
    nearNozzleLifetime = 0.90
    nearNozzleStartSize = 1.35
    nearNozzleSizeGrowth = 5.30
    nearNozzleOpacity = 0.72
    nearNozzleInitialSpeed = 12.0
    nearNozzleVelocityInheritance = 0.97
    nearNozzleSpreadSpeed = 1.10
    nearNozzleOffset = 2.50
    nearNozzleRadialJitter = 0.12
    nearNozzleTurbulence = 0.52
    nearNozzleTurbulenceFrequency = 0.12
    nearNozzleHighAltitudeSizeMultiplier = 1.45
    nearNozzleBrightness = 0.80
    nearNozzleWarmth = 0.035

    // Projected ground/ocean shadow for the persistent trail. Geometry is time-sliced at 8 Hz and
    // PQS terrain heights are cached, avoiding a full trail projection every rendered frame.
    smokeShadowEnabled = true
    smokeShadowUpdateHz = 8
    smokeShadowMaxQuads = 900
    smokeShadowSampleStride = 12
    smokeShadowMaxAltitude = 14000
    smokeShadowOpacity = 0.18
    smokeShadowSizeMultiplier = 1.55
    smokeShadowLengthMultiplier = 1.15
    smokeShadowMaxStretch = 3.2
    smokeShadowSurfaceOffset = 4.0
    smokeShadowMinSourceAlpha = 0.025
    smokeShadowMinSunDot = 0.055

    // Terrain-cache budget for projected shadows. These values only affect newly encountered
    // surface cells; already cached cells are essentially free on following frames.
    smokeShadowTerrainQueriesPerFrame = 16
    smokeShadowTerrainCacheMeters = 220
    smokeShadowTerrainCacheCapacity = 12000

    // Engine-dependent smoke scaling. The code now derives motor scale continuously from the full
    // SolidFuel mass (primary signal), dry part mass and max thrust. These values define the visual
    // endpoints of that scale rather than creating only two hard engine classes.
    engineScalingEnabled = true
    engineMinThrust = 8
    engineMaxThrust = 800

    // Even small SRBs now produce a full launch-plume column instead of a pencil-thin line.
    smallEngineEmissionMultiplier = 0.90
    largeEngineEmissionMultiplier = 1.10

    smallEngineSizeMultiplier = 1.30
    largeEngineSizeMultiplier = 1.65

    // Small-motor smoke now remains long enough for the bottom of the column to expand into the
    // broad billowing plume visible during a real launch.
    smallEngineLifetimeMultiplier = 0.75
    largeEngineLifetimeMultiplier = 1.00

    smallEngineOpacityMultiplier = 0.95
    largeEngineOpacityMultiplier = 1.08

    smallEngineSpacingMultiplier = 1.00
    largeEngineSpacingMultiplier = 0.95

    // Local cloud expansion is intentionally stronger than the small-scale wind eddies. This makes
    // the trail widen and lose coherence naturally instead of being drawn into a visible sine wave.
    // Small-motor particles also get less dynamic diffusion automatically because their shorter
    // per-particle lifetime maps to a lower source scale inside SmokeParticlePool.
    driftSpeed = 1.8
    diffusionSpeed = 4.4
    diffusionGrowth = 1.95
    buoyancy = 0.24
    dynamicWindResponse = 1.6
    turbulenceStrength = 1.1
    turbulenceFrequency = 0.055

    // Near-pad hold
    nearGroundHoldHeight = 60
    nearGroundWindMultiplier = 0.12
    nearGroundDiffusionMultiplier = 0.25
    nearGroundBuoyancyMultiplier = 0.40

    // Shuttle-style launch-pad cloud
    padCloudEnabled = true
    padCloudHeight = 120
    padCloudCellSize = 18
    padCloudDensityThreshold = 5
    padCloudDensitySaturation = 24
    padCloudOutflowSpeed = 18
    padCloudUpdraftSpeed = 5.5
    padCloudGlobalBias = 0.72

    // Continuous wind field. The prevailing wind now varies only on broad vertical/time scales,
    // avoiding the regular snake-like bends produced by short-period directional changes.
    windEnabled = true
    windSpeed = 4.4
    windLayerHeight = 9000
    windTopAltitude = 32000
    windDirectionChangeRadians = 0.30
    windTimeScale = 0.00012

    // Large, weak local eddies. Their scale is deliberately much wider than the plume diameter, so
    // they distort and fan out the trail without producing a repeating zig-zag/sine-wave pattern.
    windSpreadSpeed = 1.0
    windSpreadScale = 850
    windSpreadVerticalScale = 2600
    windSpreadTimeScale = 0.00035

    debugLogging = false
}
