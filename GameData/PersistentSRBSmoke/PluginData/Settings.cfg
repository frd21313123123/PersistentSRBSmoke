PERSISTENT_SRB_SMOKE
{
    enabled = true

    // Performance / persistence
    maxParticles = 36000
    maxEmitPerFrame = 160
    lifetime = 210

    // Existing smoke is re-evaluated this many times per second. Old/far smoke is additionally
    // throttled by the per-particle LOD settings below while Unity keeps integrating its velocity.
    dynamicMotionHz = 6

    // Full loaded-vessel engine discovery is a fallback safety scan, so it does not need to run
    // every frame or every second.
    engineScanInterval = 2

    // Each cloudlet is a set of crossed transparent quads. Three planes are the balanced default.
    cloudletPlanes = 3

    // Distance sorting is expensive with tens of thousands of transparent cloudlets.
    sortParticles = false

    // Dynamic-motion LOD. Age values are normalized over each particle's lifetime.
    dynamicMidAge = 0.20
    dynamicOldAge = 0.55
    dynamicMidStride = 2
    dynamicOldStride = 4
    dynamicFarDistance = 5000
    dynamicFarStrideMultiplier = 2

    // Samples for the smooth large-scale altitude profile. Catmull-Rom interpolation removes
    // visible boundaries between cached samples.
    windCacheLayers = 128

    // Keep smoke aging/motion synchronized with KSP Universal Time.
    followUniversalTime = true
    maxWarpSimulationStep = 5

    // Disable stock/legacy smoke particle emitters on SolidFuel engine parts.
    suppressStockSmoke = true
    stockSmokeRefreshInterval = 0.75

    // Trail continuity
    baseEmissionRate = 32
    particlesPerMeter = 0.30
    maxParticleSpacing = 1.75
    highAltitudeSpacingMultiplier = 1.25

    thinAtmosphereDensityFloor = 0.42
    teleportDistance = 750

    // Visual appearance / expansion
    startSize = 8.0
    sizeGrowth = 18.0
    highAltitudeSizeMultiplier = 1.85
    opacity = 0.80

    // Slightly grey rather than pure white.
    smokeBrightness = 0.88
    engineColorVariation = 0.05

    // Engine-dependent smoke scaling
    engineScalingEnabled = true
    engineMinThrust = 8
    engineMaxThrust = 800

    smallEngineEmissionMultiplier = 0.18
    largeEngineEmissionMultiplier = 1.10

    smallEngineSizeMultiplier = 0.38
    largeEngineSizeMultiplier = 1.10

    smallEngineLifetimeMultiplier = 0.45
    largeEngineLifetimeMultiplier = 1.00

    smallEngineOpacityMultiplier = 0.72
    largeEngineOpacityMultiplier = 1.00

    smallEngineSpacingMultiplier = 2.40
    largeEngineSpacingMultiplier = 0.95

    // Local cloud expansion. This is deliberately independent from the prevailing wind so every
    // section of the trail widens gradually instead of staying as a rigid narrow ribbon.
    driftSpeed = 1.8
    diffusionSpeed = 4.0
    diffusionGrowth = 1.75
    buoyancy = 0.24
    dynamicWindResponse = 2.1
    turbulenceStrength = 1.1
    turbulenceFrequency = 0.055

    // Near-pad hold
    nearGroundHoldHeight = 60
    nearGroundWindMultiplier = 0.12
    nearGroundDiffusionMultiplier = 0.25
    nearGroundBuoyancyMultiplier = 0.40

    // Shuttle-style launch-pad cloud
    padCloudEnabled = true
    padCloudHeight = 120
    padCloudCellSize = 18
    padCloudDensityThreshold = 5
    padCloudDensitySaturation = 24
    padCloudOutflowSpeed = 18
    padCloudUpdraftSpeed = 5.5
    padCloudGlobalBias = 0.72

    // Continuous wind field. windLayerHeight is a broad vertical variation scale, not a hard layer.
    // The mean wind now bends gently over kilometres instead of stepping at a few obvious heights.
    windEnabled = true
    windSpeed = 4.8
    windLayerHeight = 6500
    windTopAltitude = 32000
    windDirectionChangeRadians = 0.55
    windTimeScale = 0.00035

    // Small local horizontal eddies. These operate at every altitude and cause neighbouring pieces
    // of the trail to slowly separate, fan out and wrinkle instead of moving as one solid strip.
    windSpreadSpeed = 2.4
    windSpreadScale = 260
    windSpreadVerticalScale = 1100
    windSpreadTimeScale = 0.0020

    debugLogging = false
}
