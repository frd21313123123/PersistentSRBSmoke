VOLUMETRIC_SRB_SMOKE
{
    // Schema v2 is intentionally clean. Settings from pre-volumetric versions are ignored.
    schemaVersion = 2
    enabled = true

    // Fixed body-relative trail pool and Balanced (1080p / 2–4 SRB) view budget.
    maxStoredSegments = 4096
    visibleNearSegments = 256
    visibleMidSegments = 512
    visibleFarSegments = 256
    nearDistance = 350
    midDistance = 1800
    farDistance = 9000
    segmentLength = 5.5
    maxSegmentsPerInjection = 24
    mergeMinAge = 8
    mergeCellSize = 42

    // Source mass. Distance creates connected topology; the time term keeps dense smoke while
    // an SRB is held at the launch pad or climbing very slowly.
    baseEmissionRate = 58
    massPerMeter = 8.5
    timeEmissionFadeSpeed = 20
    teleportDistance = 750
    nozzleOffset = 2.2
    nozzleLength = 10
    nozzleRadius = 1.45
    nozzleLifetime = 0.90
    trailRadius = 9
    trailLifetime = 210
    thinAtmosphereDensityFloor = 0.42

    // 4 Hz atmospheric evolution, including Universal Time / rails-warp advancement.
    dynamicMotionHz = 4
    offscreenDynamicMotionHz = 0.5
    maxWarpSimulationStep = 5
    dissipationRate = 0.88
    radiusGrowth = 1.95
    diffusionSpeed = 4.4
    buoyancy = 0.24
    dynamicWindResponse = 1.6
    turbulenceStrength = 1.1
    turbulenceFrequency = 0.055
    nearGroundHoldHeight = 60
    nearGroundWindMultiplier = 0.12
    nearGroundDiffusionMultiplier = 0.25
    nearGroundBuoyancyMultiplier = 0.40

    // At most eight logical 32³ local launch-pad density fields.
    padFieldEnabled = true
    padTileCount = 8
    padTileResolution = 32
    padTileSize = 90
    padFieldHeight = 120
    padOutflowSpeed = 18
    padUpdraftSpeed = 5.5
    padMassThreshold = 5
    padMassSaturation = 24
    padMassBias = 0.72

    // D3D11 raymarch / weighted-blended OIT. The volume is reconstructed at half resolution with
    // a 2×2 temporal footprint; history resets on camera discontinuity and depth disagreement.
    extinction = 0.074
    scattering = 0.82
    ambientLight = 0.28
    sunLight = 1.05
    sunsetWarmth = 0.72
    noiseScale = 0.082
    noiseStrength = 0.58
    nearViewSamples = 24
    midViewSamples = 14
    farViewSamples = 8
    sunShadowSamples = 4
    tileSize = 16
    maxTileCandidates = 64
    temporalReconstruction = true
    temporalBlend = 0.82
    temporalDepthThreshold = 0.004

    // Sun-projected integrated volume shadow with bounded terrain cache.
    shadowsEnabled = true
    shadowUpdateHz = 8
    shadowMaxQuads = 900
    shadowOpacity = 0.18
    shadowSizeMultiplier = 1.55
    shadowLengthMultiplier = 1.15
    shadowSurfaceOffset = 4
    shadowMaxAltitude = 14000
    shadowTerrainQueriesPerFrame = 16
    shadowTerrainCacheMeters = 220
    shadowTerrainCacheCapacity = 12000

    // SRB motor scaling. This affects optical mass, radius and persistence—not presentation type.
    engineScanInterval = 2
    engineScalingEnabled = true
    engineMinThrust = 8
    engineMaxThrust = 800
    smallEngineEmissionMultiplier = 0.90
    largeEngineEmissionMultiplier = 1.10
    smallEngineSizeMultiplier = 1.30
    largeEngineSizeMultiplier = 1.65
    smallEngineLifetimeMultiplier = 0.75
    largeEngineLifetimeMultiplier = 1.00
    smallEngineOpacityMultiplier = 0.95
    largeEngineOpacityMultiplier = 1.08
    smallEngineSpacingMultiplier = 1.00
    largeEngineSpacingMultiplier = 0.95
    smokeBrightness = 1.16
    engineColorVariation = 0.05
    fullDensityEmitterBudget = 8
    minimumEmitterDensityScale = 0.35

    // Persistent atmospheric field.
    windEnabled = true
    windCacheLayers = 64
    windSpeed = 4.4
    windLayerHeight = 9000
    windTopAltitude = 32000
    windDirectionChangeRadians = 0.30
    windTimeScale = 0.00012
    windSpreadSpeed = 1.0
    windSpreadScale = 850
    windSpreadVerticalScale = 2600
    windSpreadTimeScale = 0.00035

    followUniversalTime = true
    suppressStockSmoke = true
    stockSmokeRefreshInterval = 0.75
    debugLogging = false
}
