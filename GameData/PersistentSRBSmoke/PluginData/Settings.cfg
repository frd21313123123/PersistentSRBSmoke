PERSISTENT_SRB_SMOKE
{
    enabled = true

    // Performance
    maxParticles = 32000
    maxEmitPerFrame = 96

    // Lifetime and trail continuity
    lifetime = 150
    baseEmissionRate = 24
    particlesPerMeter = 0.22

    // Hard upper limit for longitudinal spacing between particles while moving.
    // Lower values make the trail denser but use more particles.
    maxParticleSpacing = 3.0

    teleportDistance = 750

    // Visual appearance
    startSize = 6.0
    sizeGrowth = 10.5
    opacity = 0.72

    // Local particle motion
    driftSpeed = 0.75
    buoyancy = 0.18
    turbulenceStrength = 0.65
    turbulenceFrequency = 0.08

    // Altitude-dependent wind shear
    windEnabled = true
    windSpeed = 6.0
    windLayerHeight = 2200
    windTopAltitude = 24000
    windDirectionChangeRadians = 1.15
    windTimeScale = 0.0006

    debugLogging = false
}
